<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>n次回マップ</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    #map {
      width: 100%;
      height: 100vh;
    }

    #title {
      position: absolute;
      z-index: 1000;
      top: 10px;
      left: 10px;
      background: white;
      padding: 10px;
      border-radius: 5px;
      font-weight: bold;
      box-shadow: 0 0 5px rgba(0,0,0,0.3);
    }

#controls {
  position: absolute;
  z-index: 1000;
  top: 10px;
  left: 10px;
  background: white;
  padding: 10px;
  border-radius: 5px;
  box-shadow: 0 0 5px rgba(0,0,0,0.3);
}

#controls select {
  font-size: 16px;
  margin-left: 5px;
}

  </style>
</head>
<body>

<div id="controls">

  街:
  <select id="sheetSelect">
  </select>

  評価:
  <select id="scoreFilter">

    <option value="0">
      すべて
    </option>

    <option value="3.0">
      3.0以上
    </option>

    <option value="3.3">
      3.3以上
    </option>

    <option value="3.5">
      3.5以上
    </option>

    <option value="3.7">
      3.7以上
    </option>

  </select>

  <label style="margin-left:10px;">
    <input
      type="checkbox"
      id="openNowFilter"
    >
    営業中のみ
  </label>

営業時刻:
<input
  type="time"
  id="timeFilter"
/>

</div>

<div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>

//----------------------------------
// URLパラメータ取得
//----------------------------------

const params =
  new URLSearchParams(
    window.location.search
  );

let sheet =
  params.get("sheet");

console.log("sheet=", sheet);

if (!sheet) {

  sheet = "";

}

const scoreFilter =
  Number(
    params.get("score")
    || 0
  );

const openNowOnly =
  params.get("openNow")
  === "1";

const timeFilter =
  params.get("time")
  || "";

//----------------------------------
// 地図初期化
//----------------------------------

const map =
  L.map("map");

L.control.scale().addTo(map);

L.tileLayer(
  "https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png",
  {
    attribution:
      "&copy; OpenStreetMap contributors &copy; CARTO",
    subdomains: "abcd",
    maxZoom: 20
  }
).addTo(map);

//----------------------------------
// 現在地表示
//----------------------------------

if (navigator.geolocation) {

  navigator.geolocation.getCurrentPosition(

    function(position) {

      const lat =
        position.coords.latitude;

      const lng =
        position.coords.longitude;

      L.circle(
        [lat, lng],
        {
          radius: 30,
          color: "#0066ff",
          fillColor: "#0066ff",
          fillOpacity: 0.2
        }
      ).addTo(map);

      L.circleMarker(
        [lat, lng],
        {
          radius: 8,
          color: "#0066ff",
          fillColor: "#0066ff",
          fillOpacity: 1
        }
      )
      .addTo(map)
      .bindPopup("現在地");

    },

    function(error) {

      console.log(
        "位置情報取得失敗",
        error
      );

    }

  );

}
// ←ここから追加

function createEmojiIcon(emoji) {

  return L.divIcon({

    html:
      `<div
        style="
          font-size:28px;
          text-align:center;
          line-height:30px;
        "
      >
        ${emoji}
      </div>`,

    className: "",

    iconSize: [30, 30],

    iconAnchor: [15, 30]

  });

}

function getIcon(shop) {

  const genre =
    shop.genre || "";

  if (
    genre.includes("立ち飲み")
  ) {
    return createEmojiIcon("🏮");
  }

  if (
    genre.includes("日本酒")
  ) {
    return createEmojiIcon("🍶");
  }

  if (
    genre.includes("海鮮")
  ) {
    return createEmojiIcon("🐟");
  }

  if (
    genre.includes("ビア")
  ) {
    return createEmojiIcon("🍺");
  }

  if (
    genre.includes("餃子") ||
    genre.includes("中華")
  ) {
    return createEmojiIcon("🥟");
  }

  if (
    genre.includes("焼き鳥") ||
    genre.includes("串焼き")
  ) {
    return createEmojiIcon("🐔");
  }

  if (
    genre.includes("タイ料理")
  ) {
    return createEmojiIcon("🇹🇭");
  }

  return createEmojiIcon("🍽️");

}
function isOpenAt(
  shop,
  targetTime
) {

  if (
    !shop.open ||
    !shop.close
  ) {
    return true;
  }

  const open =
    shop.open;

  const close =
    shop.close;

  if (
    close < open
  ) {

    return (
      targetTime >= open ||
      targetTime <= close
    );

  }

  return (
    targetTime >= open &&
    targetTime <= close
  );

}
// 


    //----------------------------------
    // API
    //----------------------------------

const sheetApi =
  "https://script.google.com/macros/s/AKfycbzdHCfjgsKxiAtVExTIynIAJf-Y0Nr2Nro9tnShlEJU62keeCql4AxZmo-f-0zOJySe/exec?mode=sheets";

fetch(sheetApi)
  .then(response => response.json())
  .then(sheets => {



    const select =
      document.getElementById(
        "sheetSelect"
      );

    sheets.forEach(name => {

      const option =
        document.createElement(
          "option"
        );

      option.value = name;
      option.textContent = name;

      if (name === sheet) {
        option.selected = true;
      }

      select.appendChild(option);

    });

    document.getElementById(
      "scoreFilter"
    ).value =
      scoreFilter;

    document.getElementById(
      "openNowFilter"
    ).checked =
      openNowOnly;

document.getElementById(
  "timeFilter"
).value =
  timeFilter;

select.addEventListener(
  "change",
  function() {

    location.href =
      "?sheet="
      + this.value
      + "&score="
      + document
          .getElementById(
            "scoreFilter"
          )
          .value
      + "&openNow="
      + (
          document
            .getElementById(
              "openNowFilter"
            )
            .checked
          ? 1
          : 0
        )
  + "&time="
  + document
      .getElementById(
        "timeFilter"
      )
      .value;

  }
);

document
  .getElementById(
    "scoreFilter"
  )
  .addEventListener(
    "change",
    function() {

location.href =
  "?sheet="
  + document
      .getElementById(
        "sheetSelect"
      )
      .value
        + "&score="
        + this.value
        + "&openNow="
        + (
            document
              .getElementById(
                "openNowFilter"
              )
              .checked
            ? 1
            : 0
          )
        + "&time="
        + document
            .getElementById(
              "timeFilter"
            )
            .value;

    }
  );


document
  .getElementById(
    "openNowFilter"
  )
  .addEventListener(
    "change",
    function() {

      location.href =
        "?sheet="
        + document
            .getElementById(
              "sheetSelect"
            )
            .value
        + "&score="
        + document
            .getElementById(
              "scoreFilter"
            )
            .value
        + "&openNow="
        + (
            this.checked
            ? 1
            : 0
          )
        + "&time="
        + document
            .getElementById(
              "timeFilter"
            )
            .value;

    }
  );
document
  .getElementById(
    "timeFilter"
  )
  .addEventListener(
    "change",
    function() {

location.href =
  "?sheet="
  + document
      .getElementById(
        "sheetSelect"
      )
      .value
        + "&score="
        + document
            .getElementById(
              "scoreFilter"
            )
            .value
        + "&openNow="
        + (
            document
              .getElementById(
                "openNowFilter"
              )
              .checked
            ? 1
            : 0
          )
        + "&time="
        + this.value;

    }
  );
  });

    const apiUrl =
      "https://script.google.com/macros/s/AKfycbzdHCfjgsKxiAtVExTIynIAJf-Y0Nr2Nro9tnShlEJU62keeCql4AxZmo-f-0zOJySe/exec"
      + (
      sheet
      ? "?sheet=" + sheet
      : ""
    );

    //----------------------------------
    // 店舗取得
    //----------------------------------

    fetch(apiUrl)
      .then(response => response.json())
      .then(shops => {

        console.log(shops);

        const bounds = [];

shops
  .filter(shop => {

    const score =
      Number(
        shop.score
      );

    if (
      score <
      scoreFilter
    ) {
      return false;
    }

    if (
      openNowOnly
    ) {

      if (
        !shop.open ||
        !shop.close
      ) {
        return false;
      }

      const now =
        new Date();

      let nowMinutes =
        now.getHours() * 60 +
        now.getMinutes();

      const [
        openHour,
        openMinute
      ] =
        shop.open
          .split(":")
          .map(Number);

      const [
        closeHour,
        closeMinute
      ] =
        shop.close
          .split(":")
          .map(Number);

      const openMinutes =
        openHour * 60 +
        openMinute;

      let closeMinutes =
        closeHour * 60 +
        closeMinute;

      // 17:00～02:00対応
      if (
        closeMinutes <
        openMinutes
      ) {

        closeMinutes +=
          24 * 60;

        if (
          nowMinutes <
          openMinutes
        ) {

          nowMinutes +=
            24 * 60;

        }

      }

      if (
        nowMinutes <
          openMinutes ||
        nowMinutes >
          closeMinutes
      ) {
        return false;
      }

    }

if (
  timeFilter
) {

  if (
    !isOpenAt(
      shop,
      timeFilter
    )
  ) {
    return false;
  }

}
    return true;

  })
  .forEach(shop => {

    if (!shop.lat || !shop.lng) {
      return;
    }

    const lat = Number(shop.lat);
    const lng = Number(shop.lng);

    bounds.push([
      lat,
      lng
    ]);

L.marker(
  [
    lat,
    lng
  ],
  {
    icon:
      getIcon(shop)
  }
)
          .addTo(map)
          .bindPopup(
            `
            <div style="min-width:250px">

              <h3 style="margin:0 0 8px 0">
                ${shop.name}
              </h3>

              <p>
                ⭐ 評価:
                ${shop.score || "-"}
              </p>

              <p>
                🕒
                ${shop.open || "-"}
                ～
                ${shop.close || "-"}
              </p>

              <p>
                🍺
                ${shop.genre || "-"}
              </p>

              <p>
                📝
                ${shop.memo || ""}
              </p>

              <p>
                📍
                ${shop.address || ""}
              </p>

              <p>
                <a
                  href="${shop.tabelog_url}"
                  target="_blank"
                >
                  食べログを見る
                </a>
              </p>

            </div>
            `
          );

        });

        if (bounds.length > 0) {

          map.fitBounds(
            bounds,
            {
              padding: [80, 80]
            }
          );

        } else {

          map.setView(
            [35.681236, 139.767125],
            12
          );

        }

      })
      .catch(error => {

        console.error(error);

        alert(
          "データ取得に失敗しました"
        );

      });

  </script>

</body>
</html>
