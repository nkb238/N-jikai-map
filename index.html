  <script>

//----------------------------------
// URLパラメータ取得
//----------------------------------

const params =
  new URLSearchParams(
    window.location.search
  );

let sheet =
  params.get("sheet");

console.log("sheet=", sheet);

const FAVORITE_KEY = `favorites_${sheet || "default"}`;
const VISITED_KEY  = `visited_${sheet || "default"}`;

if (!sheet) {

  sheet = "";

}

const scoreFilter =
  Number(
    params.get("score")
    || 0
  );

const openNowOnly =
  params.get("openNow")
  === "1";

const favoriteOnly =
  params.get("favoriteOnly")
  === "1";

const unvisitedOnly =
  params.get("unvisitedOnly")
  === "1";

const timeFilter =
  params.get("time")
  || "";

//----------------------------------
// 地図初期化
//----------------------------------

const map =
  L.map("map");

const markers = {};

L.control.scale().addTo(map);

L.tileLayer(
  "https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png",
  {
    attribution:
      "&copy; OpenStreetMap contributors &copy; CARTO",
    subdomains: "abcd",
    maxZoom: 20
  }
).addTo(map);

//----------------------------------
// 現在地表示
//----------------------------------

if (navigator.geolocation) {

  navigator.geolocation.getCurrentPosition(

    function(position) {

      const lat =
        position.coords.latitude;

      const lng =
        position.coords.longitude;

      L.circle(
        [lat, lng],
        {
          radius: 30,
          color: "#0066ff",
          fillColor: "#0066ff",
          fillOpacity: 0.2
        }
      ).addTo(map);

      L.circleMarker(
        [lat, lng],
        {
          radius: 8,
          color: "#0066ff",
          fillColor: "#0066ff",
          fillOpacity: 1
        }
      )
      .addTo(map)
      .bindPopup("現在地");

    },

    function(error) {

      console.log(
        "位置情報取得失敗",
        error
      );

    }

  );

}

function getIcon(shop) {

  const favorite = isFavorite(shop);
  const visited = isVisited(shop);

  const showLabel =
    map.getZoom() >= 17;

  const genre =
    shop.genre || "";

  for (const rule of ICON_RULES) {

    if (
      rule.keywords.some(keyword =>
        genre.includes(keyword)
      )
    ) {

      return createEmojiIcon(
        rule.emoji,
        favorite,
        visited,
        shop.name,
        showLabel
      );

    }

  }

  return createEmojiIcon(
    "🍽️",
    favorite,
    visited,
    shop.name,
    showLabel
  );

}

  return `

//----------------------------------
// お気に入り管理
//----------------------------------

let favorites =
  JSON.parse(
    localStorage.getItem(FAVORITE_KEY)
    || "[]"
  );

let visited =
  JSON.parse(
    localStorage.getItem(VISITED_KEY)
    || "[]"
  );

function isVisited(shop) {

  return visited.includes(
    String(shop.id)
  );

}

function isFavorite(shop) {

  return favorites.includes(
    String(shop.id)
  );

}

function toggleFavorite(
  shopId,
  button
) {

  shopId =
    String(shopId);

  if (
    favorites.includes(shopId)
  ) {

    favorites =
      favorites.filter(
        id => id !== shopId
      );

  } else {

    favorites.push(shopId);

  }

  localStorage.setItem(
    FAVORITE_KEY,
    JSON.stringify(favorites)
  );
  const shop =
    window.allShops.find(
      s =>
        String(s.id)
        === shopId
    );

  if (
    shop &&
    markers[shopId]
  ) {

    markers[shopId]
      .setIcon(
        getIcon(shop)
      );

    markers[shopId]
      .setPopupContent(
        createPopup(shop)
      );

    updateSummary();

  }

}

function toggleVisited(
  shopId,
  button
) {

  shopId = String(shopId);

  if (
    visited.includes(shopId)
  ) {

    visited =
      visited.filter(
        id => id !== shopId
      );


  } else {

    visited.push(shopId);



  }

    localStorage.setItem(
      VISITED_KEY,
      JSON.stringify(visited)
    );

  const shop =
    window.allShops.find(
      s =>
        String(s.id)
        === shopId
    );

  if (
    shop &&
    markers[shopId]
  ) {

    markers[shopId]
      .setIcon(
        getIcon(shop)
      );
    
    markers[shopId]
      .setPopupContent(
        createPopup(shop)
    );

    updateSummary();

  }

}

function isOpenAt(
  shop,
  targetTime
) {

  if (
    !shop.open ||
    !shop.close
  ) {
    return true;
  }

  const open =
    shop.open;

  const close =
    shop.close;

  if (
    close < open
  ) {

    return (
      targetTime >= open ||
      targetTime <= close
    );

  }

  return (
    targetTime >= open &&
    targetTime <= close
  );

}
// 
function updateSummary() {

  // 🍺表示中
  document.getElementById(
    "visibleCount"
  ).textContent =
    Object.keys(markers).length + "件";

  // ❤️お気に入り
  document.getElementById(
    "favoriteCount"
  ).textContent =
    favorites.length + "件";

  // ✅訪問済み
  document.getElementById(
    "visitedCount"
  ).textContent =
    visited.length + "件";

}

//----------------------------------
// フィルタ初期化

function initFilter() {

  const panel =
    document.getElementById("filterPanel");

  const card =
    document.getElementById("filterCard");

  const summary =
    document.getElementById("summary");

  const controls =
    document.getElementById("controls");

  const toggleButton =
    document.getElementById("toggleFilter");

  let filterOpen = false;

  function closeFilter() {

    filterOpen = false;

    summary.style.display = "none";
    controls.style.display = "none";

    toggleButton.textContent =
      "☰ フィルタ ▼";

  }

  // 初期状態：summary + controlsを非表示
  summary.style.display = "none";
  controls.style.display = "none";

  toggleButton.textContent = "☰ フィルタ ▼";

  toggleButton.addEventListener("click", function () {

    filterOpen = !filterOpen;

    if (filterOpen) {

      summary.style.display = "block";
      controls.style.display = "block";

      toggleButton.textContent = "☰ フィルタ ▲";

    } else {

      summary.style.display = "none";
      controls.style.display = "none";

      toggleButton.textContent = "☰ フィルタ ▼";

    }

  });
  
  window.closeFilter = closeFilter;

}
    //----------------------------------

shops
  .filter(shop => {

if (
