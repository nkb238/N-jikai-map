<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>n次回マップ</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    #map {
      width: 100%;
      height: 100vh;
    }

    #title {
      position: absolute;
      z-index: 1000;
      top: 10px;
      left: 10px;
      background: white;
      padding: 10px;
      border-radius: 5px;
      font-weight: bold;
      box-shadow: 0 0 5px rgba(0,0,0,0.3);
    }

    #filterPanel {

      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1000;
      width: 320px;

    }

    #toggleFilter {

      width: 100%;
      padding: 12px;

      font-size: 16px;
      font-weight: bold;

      background: white;
      border: none;
      border-radius: 10px;

      box-shadow: 0 2px 8px rgba(0,0,0,.2);

      cursor: pointer;

    }

    #controls {

      margin-top: 8px;

      background: white;

      padding: 12px;

      border-radius: 10px;

      box-shadow: 0 2px 8px rgba(0,0,0,.2);

    }

    #controls select {
      font-size: 16px;
      margin-left: 5px;
    }

    .controlGroup{

  margin-bottom:18px;

}

.controlGroup:last-child{

  margin-bottom:0;

}

.groupTitle{

  font-weight:bold;

  margin-bottom:10px;

  padding-bottom:4px;

  border-bottom:1px solid #ddd;

}

.controlLabel{

  display:block;

  margin-bottom:4px;

  font-size:14px;

}

#controls select,
#controls input[type="time"]{

  width:100%;

  box-sizing:border-box;

  margin-bottom:12px;

  padding:8px;

  font-size:16px;

}

.checkLabel{

  display:block;

  margin-bottom:8px;

  font-size:15px;

}

    #summary {

      margin-top: 8px;

      background: white;

      padding: 12px;

      border-radius: 10px;

      box-shadow: 0 2px 8px rgba(0,0,0,.2);

      line-height: 1.8;

      font-size: 15px;

    } 
    
    .summaryRow {

      display: flex;

      justify-content: space-between;

      align-items: center;

      padding: 4px 0;

    }

    .summaryRow span:last-child {

      font-weight: bold;

    }

  </style>
</head>
<body>

  <div id="filterPanel">
    <div id="filterCard" class="filterCard">
    <button id="toggleFilter">
    ☰ フィルタ
    </button>

<div id="summary">

  <div class="summaryRow">
    <span>
      🍺 表示中
    </span>

    <span id="visibleCount">
      0件
    </span>
  </div>

  <div class="summaryRow">
    <span>
      ❤️ お気に入り
    </span>

    <span id="favoriteCount">
      0件
    </span>
  </div>

  <div class="summaryRow">
    <span>
      ✅ 訪問済み
    </span>

    <span id="visitedCount">
      0件
    </span>
  </div>

</div>

<div id="controls">

  <div class="controlGroup">

    <div class="groupTitle">
      🔍 検索条件
    </div>

    <label class="controlLabel">
      📍 街
    </label>

    <select id="sheetSelect">
    </select>

    <label class="controlLabel">
      ⭐ 評価
    </label>

    <select id="scoreFilter">

      <option value="0">すべて</option>
      <option value="3.0">3.0以上</option>
      <option value="3.3">3.3以上</option>
      <option value="3.5">3.5以上</option>
      <option value="3.7">3.7以上</option>

    </select>

  </div>

  <div class="controlGroup">

    <div class="groupTitle">
      🕒 営業条件
    </div>

    <label class="controlLabel">
      営業時刻
    </label>

    <input
      type="time"
      id="timeFilter"
    >

    <label class="checkLabel">

      <input
        type="checkbox"
        id="openNowFilter"
      >

      営業中のみ

    </label>

  </div>

  <div class="controlGroup">

    <div class="groupTitle">
      📚 マイリスト
    </div>

    <label class="checkLabel">

      <input
        type="checkbox"
        id="favoriteOnlyFilter"
      >

      お気に入りのみ

    </label>

    <label class="checkLabel">

      <input
        type="checkbox"
        id="unvisitedOnlyFilter"
      >

      未訪問のみ

    </label>

  </div>

</div>
  </div>
  </div>
</div>

<div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>

//----------------------------------
// URLパラメータ取得
//----------------------------------

const params =
  new URLSearchParams(
    window.location.search
  );

let sheet =
  params.get("sheet");

console.log("sheet=", sheet);

if (!sheet) {

  sheet = "";

}

const scoreFilter =
  Number(
    params.get("score")
    || 0
  );

const openNowOnly =
  params.get("openNow")
  === "1";

const favoriteOnly =
  params.get("favoriteOnly")
  === "1";

const unvisitedOnly =
  params.get("unvisitedOnly")
  === "1";

const timeFilter =
  params.get("time")
  || "";

//----------------------------------
// 地図初期化
//----------------------------------

const map =
  L.map("map");

const markers = {};

L.control.scale().addTo(map);

L.tileLayer(
  "https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png",
  {
    attribution:
      "&copy; OpenStreetMap contributors &copy; CARTO",
    subdomains: "abcd",
    maxZoom: 20
  }
).addTo(map);

//----------------------------------
// 現在地表示
//----------------------------------

if (navigator.geolocation) {

  navigator.geolocation.getCurrentPosition(

    function(position) {

      const lat =
        position.coords.latitude;

      const lng =
        position.coords.longitude;

      L.circle(
        [lat, lng],
        {
          radius: 30,
          color: "#0066ff",
          fillColor: "#0066ff",
          fillOpacity: 0.2
        }
      ).addTo(map);

      L.circleMarker(
        [lat, lng],
        {
          radius: 8,
          color: "#0066ff",
          fillColor: "#0066ff",
          fillOpacity: 1
        }
      )
      .addTo(map)
      .bindPopup("現在地");

    },

    function(error) {

      console.log(
        "位置情報取得失敗",
        error
      );

    }

  );

}
// ←ここから追加

function createEmojiIcon(
  emoji,
  favorite = false,
  visited = false
) {

  return L.divIcon({

    className: "",

    html: `
      <div
        style="
          position:relative;
          width:36px;
          height:36px;
          display:flex;
          justify-content:center;
          align-items:center;
        "
      >

      <div
        style="
          position:absolute;
          top:-2px;
          left:-2px;
          display:flex;
          gap:2px;
        "
      >

        ${
          favorite
            ? `
            <div
              style="
                width:14px;
                height:14px;
                border-radius:50%;
                background:#FFD700;
                color:white;
                font-size:10px;
                display:flex;
                justify-content:center;
                align-items:center;
                box-shadow:0 0 2px rgba(0,0,0,.5);
              "
            >
              ★
            </div>
            `
            : ""
        }

        ${
          visited
            ? `
            <div
              style="
                width:14px;
                height:14px;
                border-radius:50%;
                background:#4CAF50;
                color:white;
                font-size:10px;
                display:flex;
                justify-content:center;
                align-items:center;
                box-shadow:0 0 2px rgba(0,0,0,.5);
              "
            >
              ✓
            </div>
            `
            : ""
        }

      </div>

        <div
          style="
            font-size:28px;
            line-height:28px;
          "
        >
          ${emoji}
        </div>

      </div>
    `,

    iconSize: [36,36],

    iconAnchor: [18,36],

    popupAnchor: [0,-30]

  });

}

function getIcon(shop) {

  const favorite = isFavorite(shop);
  const visited =  isVisited(shop);
  const genre =
    shop.genre || "";

  if (
    genre.includes("立ち飲み")
  ) {
    return createEmojiIcon("🏮",
  favorite,
  visited);
  }

  if (
    genre.includes("日本酒")
  ) {
    return createEmojiIcon("🍶",
  favorite,
  visited);
  }

  if (
    genre.includes("海鮮")
  ) {
    return createEmojiIcon("🐟",
  favorite,
  visited);
  }

  if (
    genre.includes("ビア")
  ) {
    return createEmojiIcon("🍺",
  favorite,
  visited);
  }

  if (
    genre.includes("餃子") ||
    genre.includes("中華")
  ) {
    return createEmojiIcon("🥟",
  favorite,
  visited);
  }

  if (
    genre.includes("焼き鳥") ||
    genre.includes("串焼き")
  ) {
    return createEmojiIcon("🐔",
  favorite,
  visited);
  }

  if (
    genre.includes("タイ料理")
  ) {
    return createEmojiIcon("🇹🇭",
  favorite,
  visited);
  }

  return createEmojiIcon("🍽️",
  favorite,
  visited);

}

function createPopup(shop) {

  return `
    <div style="min-width:250px">

      <h3 style="margin:0 0 8px 0">
        ${shop.name}
      </h3>

      <p>
        ⭐ 評価:
        ${shop.score || "-"}
      </p>

      <p>
        🕒
        ${shop.open || "-"}
        ～
        ${shop.close || "-"}
      </p>

      <p>
        🍺
        ${shop.genre || "-"}
      </p>

      ${
        shop.seats
          ? `
            <p>
              🪑
              ${shop.seats}席
            </p>
          `
          : ""
      }

      <p>
        📝
        ${shop.memo || ""}
      </p>

      <p>
        📍
        ${shop.address || ""}
      </p>

      <p>

        <a
          href="${shop.tabelog_url}"
          target="_blank"
        >
          食べログを見る
        </a>

      </p>

      <p>

        <a
          href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(shop.name + ' ' + shop.address)}"
          target="_blank"
        >
          Google Mapsで開く
        </a>

      </p>

      <p>

        <button
          onclick="toggleFavorite('${shop.id}', this)"
        >
          ${
            isFavorite(shop)
              ? "★お気に入り解除"
              : "☆お気に入り登録"
          }
        </button>

      </p>

      <p>

      <button
        onclick="
          toggleVisited('${shop.id}', this)
        "
      >

      ${
        isVisited(shop)
          ? "☑ 訪問済み解除"
          : "☐ 訪問済みにする"
      }

      </button>

      </p>

    </div>
  `;

}

//----------------------------------
// お気に入り管理
//----------------------------------

let favorites =
  JSON.parse(
    localStorage.getItem("favorites")
    || "[]"
  );

let visited =
  JSON.parse(
    localStorage.getItem("visited")
    || "[]"
  );

function isVisited(shop) {

  return visited.includes(
    String(shop.id)
  );

}

function isFavorite(shop) {

  return favorites.includes(
    String(shop.id)
  );

}

function toggleFavorite(
  shopId,
  button
) {

  shopId =
    String(shopId);

  if (
    favorites.includes(shopId)
  ) {

    favorites =
      favorites.filter(
        id => id !== shopId
      );

  } else {

    favorites.push(shopId);

  }

  localStorage.setItem(
    "favorites",
    JSON.stringify(
      favorites
    )
  );

  const shop =
    window.allShops.find(
      s =>
        String(s.id)
        === shopId
    );

  if (
    shop &&
    markers[shopId]
  ) {

    markers[shopId]
      .setIcon(
        getIcon(shop)
      );

    markers[shopId]
      .setPopupContent(
        createPopup(shop)
      );

    updateSummary();

  }

}

function toggleVisited(
  shopId,
  button
) {

  shopId = String(shopId);

  if (
    visited.includes(shopId)
  ) {

    visited =
      visited.filter(
        id => id !== shopId
      );


  } else {

    visited.push(shopId);



  }

  localStorage.setItem(
    "visited",
    JSON.stringify(
      visited
    )
  );

  const shop =
    window.allShops.find(
      s =>
        String(s.id)
        === shopId
    );

  if (
    shop &&
    markers[shopId]
  ) {

    markers[shopId]
      .setIcon(
        getIcon(shop)
      );
    
    markers[shopId]
      .setPopupContent(
        createPopup(shop)
    );

    updateSummary();

  }

}

function isOpenAt(
  shop,
  targetTime
) {

  if (
    !shop.open ||
    !shop.close
  ) {
    return true;
  }

  const open =
    shop.open;

  const close =
    shop.close;

  if (
    close < open
  ) {

    return (
      targetTime >= open ||
      targetTime <= close
    );

  }

  return (
    targetTime >= open &&
    targetTime <= close
  );

}
// 
function updateSummary() {

  // 🍺表示中
  document.getElementById(
    "visibleCount"
  ).textContent =
    Object.keys(markers).length + "件";

  // ❤️お気に入り
  document.getElementById(
    "favoriteCount"
  ).textContent =
    favorites.length + "件";

  // ✅訪問済み
  document.getElementById(
    "visitedCount"
  ).textContent =
    visited.length + "件";

}

//----------------------------------
// フィルタ初期化
//----------------------------------

function initFilter() {

  const panel =
    document.getElementById("filterPanel");

  const card =
    document.getElementById("filterCard");

  const summary =
    document.getElementById("summary");

  const controls =
    document.getElementById("controls");

  const toggleButton =
    document.getElementById("toggleFilter");

  let filterOpen = false;

  // 初期状態：summary + controlsを非表示
  summary.style.display = "none";
  controls.style.display = "none";

  toggleButton.textContent = "☰ フィルタ ▼";

  toggleButton.addEventListener("click", function () {

    filterOpen = !filterOpen;

    if (filterOpen) {

      summary.style.display = "block";
      controls.style.display = "block";

      toggleButton.textContent = "☰ フィルタ ▲";

    } else {

      summary.style.display = "none";
      controls.style.display = "none";

      toggleButton.textContent = "☰ フィルタ ▼";

    }

  });
}
    //----------------------------------
    // API
    //----------------------------------
initFilter();

const sheetApi =
  "https://script.google.com/macros/s/AKfycbzdHCfjgsKxiAtVExTIynIAJf-Y0Nr2Nro9tnShlEJU62keeCql4AxZmo-f-0zOJySe/exec?mode=sheets";

fetch(sheetApi)
  .then(response => response.json())
  .then(sheets => {



    const select =
      document.getElementById(
        "sheetSelect"
      );

    sheets.forEach(name => {

      const option =
        document.createElement(
          "option"
        );

      option.value = name;
      option.textContent = name;

      if (name === sheet) {
        option.selected = true;
      }

      select.appendChild(option);

    });

    document.getElementById(
      "scoreFilter"
    ).value =
      scoreFilter;

    document.getElementById(
      "openNowFilter"
    ).checked =
      openNowOnly;

    document.getElementById(
      "favoriteOnlyFilter"
    ).checked =
      favoriteOnly;

    document.getElementById(
      "unvisitedOnlyFilter"
    ).checked =
      unvisitedOnly;

    document.getElementById(
      "timeFilter"
    ).value =
      timeFilter;

function updateUrl() {

  location.href =
    "?sheet="
    + document
        .getElementById(
          "sheetSelect"
        )
        .value
    + "&score="
    + document
        .getElementById(
          "scoreFilter"
        )
        .value
    + "&openNow="
    + (
        document
          .getElementById(
            "openNowFilter"
          )
          .checked
        ? 1
        : 0
      )
    + "&time="
    + document
        .getElementById(
          "timeFilter"
        )
        .value
    + "&favoriteOnly="
    + (
        document
          .getElementById(
            "favoriteOnlyFilter"
          )
          .checked
        ? 1
        : 0
      )
    + "&unvisitedOnly="
    + (
        document
          .getElementById(
            "unvisitedOnlyFilter"
          )
          .checked
        ? 1
        : 0
      );

}

select.addEventListener(
  "change",
  updateUrl
);

document
  .getElementById(
    "scoreFilter"
  )
  .addEventListener(
    "change",
    updateUrl
  );


document
  .getElementById(
    "openNowFilter"
  )
  .addEventListener(
    "change",
    updateUrl
  );


document
  .getElementById(
    "timeFilter"
  )
  .addEventListener(
    "change",
    updateUrl
  );

document
  .getElementById(
    "favoriteOnlyFilter"
  )
  .addEventListener(
    "change",
    updateUrl
  );

document
  .getElementById(
    "unvisitedOnlyFilter"
  )
  .addEventListener(
    "change",
    updateUrl
  );

  });

    const apiUrl =
      "https://script.google.com/macros/s/AKfycbzdHCfjgsKxiAtVExTIynIAJf-Y0Nr2Nro9tnShlEJU62keeCql4AxZmo-f-0zOJySe/exec"
      + (
      sheet
      ? "?sheet=" + sheet
      : ""
    );

    //----------------------------------
    // 店舗取得
    //----------------------------------

    fetch(apiUrl)
      .then(response => response.json())
      .then(shops => {

        window.allShops =
          shops;

        console.log(shops);

        const bounds = [];

shops
  .filter(shop => {

    const score =
      Number(
        shop.score
      );

    if (
      score <
      scoreFilter
    ) {
      return false;
    }

    if (
  favoriteOnly &&
  !isFavorite(shop)
) {
  return false;
}

if (
  unvisitedOnly &&
  isVisited(shop)
) {
  return false;
}

    if (
      openNowOnly
    ) {

      if (
        !shop.open ||
        !shop.close
      ) {
        return false;
      }

      const now =
        new Date();

      let nowMinutes =
        now.getHours() * 60 +
        now.getMinutes();

      const [
        openHour,
        openMinute
      ] =
        shop.open
          .split(":")
          .map(Number);

      const [
        closeHour,
        closeMinute
      ] =
        shop.close
          .split(":")
          .map(Number);

      const openMinutes =
        openHour * 60 +
        openMinute;

      let closeMinutes =
        closeHour * 60 +
        closeMinute;

      // 17:00～02:00対応
      if (
        closeMinutes <
        openMinutes
      ) {

        closeMinutes +=
          24 * 60;

        if (
          nowMinutes <
          openMinutes
        ) {

          nowMinutes +=
            24 * 60;

        }

      }

      if (
        nowMinutes <
          openMinutes ||
        nowMinutes >
          closeMinutes
      ) {
        return false;
      }

    }

if (
  timeFilter
) {

  if (
    !isOpenAt(
      shop,
      timeFilter
    )
  ) {
    return false;
  }

}
    return true;

  })
  .forEach(shop => {

    if (!shop.lat || !shop.lng) {
      return;
    }

    const lat = Number(shop.lat);
    const lng = Number(shop.lng);

    bounds.push([
      lat,
      lng
    ]);

const marker =
  L.marker(
    [
      lat,
      lng
    ],
    {
      icon:
        getIcon(shop)
    }
  )
  .addTo(map)
  .bindPopup(
    createPopup(shop)
  );

markers[
  String(shop.id)
] = marker;

        });

        if (bounds.length > 0) {

          map.fitBounds(
            bounds,
            {
              padding: [80, 80]
            }
          );

        } else {

          map.setView(
            [35.681236, 139.767125],
            12
          );

        }
        
        updateSummary();

      })
      .catch(error => {

        console.error(error);

        alert(
          "データ取得に失敗しました"
        );

      });

  </script>

</body>
</html>
